[project]
name = "adguard-issue-automation"
version = "0.1.0"
description = "High-performance Python CLI that automates issue creation, triage, and reporting for AdGuard filter lists, streamlining maintenance of large‑scale content‑blocking repositories."
authors = [
    {name = "chirag127"},
]
license = {text = "CC-BY-NC-4.0"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyautogui==0.9.54",
    "pyperclip==1.8.2",
    "requests==2.31.0",
    "keyboard==0.13.5",
    "pywin32==306",
]

[project.scripts]
adguard-reporter = "src.main:main"

[project.dev-dependencies]
ruff = "^0.1.6"
black = "^23.11.0"
isort = "^5.12.0"
pytest = "^7.4.3"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
