[project]
name = "filter-report"
version = "1.0.0"
description = "Multi-platform ad/tracker/cookie-popup/annoyance filter report preparer. Pre-fills issue templates for uBlock, AdGuard, EasyList, Brave, DandelionSprout for 1-click human submit."
authors = [
    {name = "Chirag Singhal", email = "chirag127@users.noreply.github.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
filter-report = "filter_report.cli:main"

[project.urls]
Homepage = "https://filter-report.oriz.in"
Repository = "https://github.com/chirag127/filter-report"
Issues = "https://github.com/chirag127/filter-report/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
